<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика лодок</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#3498db">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Боцман">
</head>
<body>

<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="loader-body">
    <svg class="propeller" viewBox="0 0 100 100">
      <g fill="var(--brass)">
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(120 50 50)"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(240 50 50)"/>
      </g>
      <g fill="none" stroke="var(--brass)" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
        <path d="M55 15A24 24 0 0 1 62 22" transform="rotate(-6 50 50)"/>
        <path d="M18 60A24 24 0 0 1 15 51" transform="rotate(4 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="15" fill="none" stroke="var(--ink)" stroke-width="4"/>
      <circle cx="50" cy="50" r="13" fill="none" stroke="var(--brass)" stroke-width="8"/>
    </svg>
    <span class="loader-label">Загрузка…</span>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-top-row">
      <div class="brand">
        <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Бодрый Боцман" class="brand-logo"></a>
      </div>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Меню" aria-expanded="false" aria-controls="mainNav">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
        </svg>
      </button>
    </div>
    <nav class="main-nav" id="mainNav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'payroll' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.3" y="6" width="15.4" height="8" rx="1.8"/>
          <circle cx="10" cy="10" r="2"/>
          <path d="M4.6 8h.01M15.4 12h.01"/>
        </svg>
        <span class="nav-label">Зарплаты</span>
      </a>
      <a href="{{ url_for('trips_index') }}" class="{{ 'active' if active_page == 'trips' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="3.8" r="1.6"/>
          <path d="M10 5.6v10.6M6 8.4h8M4.2 11a5.8 5.8 0 0 0 11.6 0"/>
        </svg>
        <span class="nav-label">Рейсы и инвесторы</span>
      </a>
      <a href="{{ url_for('tuning_index') }}" class="{{ 'active' if active_page == 'tuning' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 3.3a4 4 0 0 1-5.1 5.4L4.4 13.9a1.6 1.6 0 0 0 2.3 2.3l5.2-5.2a4 4 0 0 0 5.4-5.1l-2.6 2.6-1.9-.4-.4-1.9 2.6-2.6z"/>
        </svg>
        <span class="nav-label">Тюнинг-центр</span>
      </a>
      <a href="{{ url_for('fleet.index') }}" class="{{ 'active' if active_page == 'fleet' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c1.4 1 3 1 4.4 0 1.4-1 3-1 4.4 0 1.4 1 3 1 4.4 0"/>
          <path d="M5.5 17V8.5L10 3l4.5 5.5V17"/>
          <path d="M10 3v14"/>
        </svg>
        <span class="nav-label">Флот</span>
      </a>
      <a href="{{ url_for('employees.index') }}" class="{{ 'active' if active_page == 'employees' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="6" r="2.4"/><circle cx="14" cy="7" r="1.9"/><path d="M2.8 16c.3-3 1.7-5 4.2-5s4 2 4.3 5M11.2 12c.8-.8 1.7-1.2 2.8-1.2 2.1 0 3.2 1.7 3.4 4.2"/></svg>
        <span class="nav-label">Сотрудники</span>
      </a>
      <a href="{{ url_for('analytics_index') }}" class="{{ 'active' if active_page == 'analytics' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 16.5h15"/>
          <path d="M5.5 16V10.5M10 16V4M14.5 16V11.5"/>
        </svg>
        <span class="nav-label">Аналитика</span>
      </a>
      <a href="{{ url_for('supply_warehouses') }}" class="{{ 'active' if active_page == 'supply' }}">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2.3l7 3.5v8.4l-7 3.5-7-3.5V5.8l7-3.5z"/>
          <path d="M3 5.8l7 3.5 7-3.5"/>
          <path d="M10 9.3v8.4"/>
        </svg>
        <span class="nav-label">Снабжение</span>
      </a>
    </nav>
    <div class="title-block">
      <h1>Диагностика лодок</h1>
    </div>
    <div class="topbar-actions">
      <button type="button" class="push-toggle" id="pushToggle" title="Уведомления" aria-label="Уведомления">
        <svg class="push-toggle-off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a4 4 0 118 0c0 3.5 1.2 5 1.2 5H4.8S6 11.5 6 8z"/>
          <path d="M8.3 16a1.7 1.7 0 003.4 0"/>
        </svg>
        <svg class="push-toggle-on" viewBox="0 0 20 20" fill="currentColor" stroke="none">
          <path d="M6 8a4 4 0 118 0c0 3.5 1.2 5 1.2 5H4.8S6 11.5 6 8z"/>
        </svg>
      </button>
      <form action="{{ url_for('admin_logout') }}" method="post" class="topbar-logout">
        <button type="submit">Выйти</button>
      </form>
    </div>
  </div>
</header>

<main class="wrap">

  <nav class="sub-tabs">
    <a href="{{ url_for('tuning_index') }}" class="{{ 'active' if sub_page == 'orders' }}">Заказы</a>
    <a href="{{ url_for('tuning_diagnostics') }}" class="{{ 'active' if sub_page == 'diagnostics' }}">Диагностика лодок</a>
  </nav>

  <nav class="sub-tabs sub-tabs-nested">
    <a href="{{ url_for('tuning_diagnostics') }}" class="{{ 'active' if diag_page == 'hull' }}">Корпусная диагностика</a>
  </nav>

  <section class="panel">
    <div class="diag-grid">
      <div class="diag-card diag-card-add" onclick="addHullDiagnosticSheet()">
        <span>Новый диагностический лист</span>
      </div>
      {% for sheet in sheets %}
      <a class="diag-card" href="{{ url_for('hull_diagnostic_sheet', sheet_id=sheet.id) }}">
        <span>{{ sheet.boat_name }} — диагностический лист</span>
      </a>
      {% endfor %}
    </div>
  </section>

  <form id="hull-add-form" action="{{ url_for('add_hull_diagnostic_sheet') }}" method="post" class="hidden">
    <input type="hidden" id="hull-add-boat-name" name="boat_name">
  </form>

</main>

<script src="{{ url_for('static', filename='loader.js') }}"></script>
<script>
  function addHullDiagnosticSheet() {
    var boatName = prompt("Введите название лодки:");
    if (!boatName || !boatName.trim()) return;
    document.getElementById("hull-add-boat-name").value = boatName.trim();
    document.getElementById("hull-add-form").submit();
  }
</script>

</body>
</html>
