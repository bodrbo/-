<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет сотрудника</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#3498db">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Боцман">
</head>
<body>

<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="loader-body">
    <svg class="propeller" viewBox="0 0 100 100">
      <g fill="var(--brass)">
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(120 50 50)"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(240 50 50)"/>
      </g>
      <g fill="none" stroke="var(--brass)" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
        <path d="M55 15A24 24 0 0 1 62 22" transform="rotate(-6 50 50)"/>
        <path d="M18 60A24 24 0 0 1 15 51" transform="rotate(4 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="15" fill="none" stroke="var(--ink)" stroke-width="4"/>
      <circle cx="50" cy="50" r="13" fill="none" stroke="var(--brass)" stroke-width="8"/>
    </svg>
    <span class="loader-label">Загрузка…</span>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Бодрый Боцман" class="brand-logo">
    </div>
    <div class="title-block">
      <h1>Личный кабинет сотрудника</h1>
    </div>
  </div>
</header>

<main class="wrap login-wrap">
  <section class="panel login-panel">
    <h2>Вход</h2>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" class="entry-form login-form">
      <div class="field field-wide">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field field-wide">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="field field-submit field-wide">
        <button type="submit">Войти</button>
      </div>
    </form>
  </section>
</main>

<script src="{{ url_for('static', filename='loader.js') }}"></script>

</body>
</html>
