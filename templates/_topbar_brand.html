{% if is_demo_tenant %}
{% if demo_tenant_accent_color %}
<style>:root { --brass: {{ demo_tenant_accent_color }}; --brass-strong: {{ demo_tenant_accent_color }}; }</style>
{% endif %}
<a href="{{ url_for('index') }}">
  {% if demo_tenant_logo %}
  <img src="{{ url_for('static', filename='demo_logos/' + demo_tenant_logo) }}" alt="{{ demo_tenant_company_name }}" class="brand-logo">
  {% else %}
  <span class="brand-logo-text">{{ demo_tenant_company_name }}</span>
  {% endif %}
</a>
{% else %}
<a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Бодрый Боцман" class="brand-logo"></a>
{% endif %}
