<dialog id="release-notice" aria-labelledby="release-notice-title" aria-describedby="release-notice-items">
  {% if release_logo %}<img class="release-notice-logo" src="{{ release_logo }}" alt="{{ release_company }}">{% else %}<p class="release-notice-company">{{ release_company }}</p>{% endif %}
  <h2 id="release-notice-title">{{ release.title }}</h2>
  <ul id="release-notice-items">{% for item in release_items %}<li>{{ item }}</li>{% endfor %}</ul>
  <p id="release-notice-error" role="alert" hidden></p>
  <button id="release-notice-confirm" type="button">Понятно</button>
</dialog>
<style>
#release-notice { box-sizing: border-box; width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 28px; border: 0; border-radius: 16px; background: #fff; color: #082c3b; font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#release-notice::backdrop { background: rgba(8,44,59,.65); }
#release-notice .release-notice-logo { display: block; width: auto; height: auto; max-width: min(220px, 100%); max-height: 90px; margin: 0 auto 22px; }
#release-notice h2 { margin: 0 0 16px; font-size: 24px; color: #082c3b; text-align: center; }
#release-notice ul { padding-left: 20px; margin: 0 0 24px; font-size: 15px; line-height: 1.55; }
#release-notice li + li { margin-top: 10px; }
#release-notice-confirm { width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: #01748e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
#release-notice-confirm:focus-visible { outline: 3px solid #082c3b; outline-offset: 3px; }
#release-notice-confirm:disabled { opacity: .65; cursor: wait; }
#release-notice-error { color: #b3402c; font-size: 14px; }
#release-notice .release-notice-company { text-align: center; font-weight: 700; }
</style>
<script id="release-notice-config" type="application/json">{{ release_config|tojson }}</script>
<script src="{{ url_for('static', filename='release-notice.js') }}" defer></script>
