<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODRBO — Личные кабинеты</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#3498db">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Боцман">
</head>
<body>

<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="loader-body">
    <svg class="propeller" viewBox="0 0 100 100">
      <g fill="var(--brass)">
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(120 50 50)"/>
        <path d="M47 37C32 35 18 26 16 14C16 9 20 6 25 7C36 9 46 17 50 27C52 31 53 34 53 37Z" transform="rotate(240 50 50)"/>
      </g>
      <g fill="none" stroke="var(--brass)" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
        <path d="M55 15A24 24 0 0 1 62 22" transform="rotate(-6 50 50)"/>
        <path d="M18 60A24 24 0 0 1 15 51" transform="rotate(4 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="15" fill="none" stroke="var(--ink)" stroke-width="4"/>
      <circle cx="50" cy="50" r="13" fill="none" stroke="var(--brass)" stroke-width="8"/>
    </svg>
    <span class="loader-label">Загрузка…</span>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Бодрый Боцман" class="brand-logo"></a>
    </div>
    <div class="title-block">
      <h1>Выберите личный кабинет</h1>
    </div>
  </div>
</header>

<main class="wrap home-wrap">
  <div class="home-cards">
    <a href="{{ url_for('admin_login') }}" class="home-card">
      <span class="home-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="12" cy="12" r="3"/>
          <circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"/>
          <path d="M15 12h5"/>
          <path d="M13.5 14.6l2.5 4.33"/>
          <path d="M10.5 14.6l-2.5 4.33"/>
          <path d="M9 12H4"/>
          <path d="M10.5 9.4L8 5.07"/>
          <path d="M13.5 9.4l2.5-4.33"/>
        </svg>
      </span>
      <span class="home-card-title">Личный кабинет администратора</span>
      <span class="home-card-sub">Зарплаты, рейсы и выплаты инвесторам, импорт из Yclients</span>
    </a>
    <a href="{{ url_for('investor_login') }}" class="home-card">
      <span class="home-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 17 9 11 13 15 21 7"/>
          <polyline points="15 7 21 7 21 13"/>
        </svg>
      </span>
      <span class="home-card-title">Личный кабинет инвестора</span>
      <span class="home-card-sub">Финансовый результат по вашему катеру</span>
    </a>
    <a href="{{ url_for('team_login') }}" class="home-card">
      <span class="home-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
        </svg>
      </span>
      <span class="home-card-title">Личный кабинет сотрудника</span>
      <span class="home-card-sub">Сколько вы заработали за смены</span>
    </a>
  </div>
</main>

<script src="{{ url_for('static', filename='loader.js') }}"></script>

</body>
</html>
